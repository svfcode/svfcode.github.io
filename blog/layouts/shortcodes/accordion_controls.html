<div class="accordion-controls" role="group" aria-label="{{ .Get "label" | default "Управление секциями" }}">
    <button type="button" class="accordion-toggle-all accordion-toggle-all--expand" data-action="expand" aria-label="{{ .Get "expand" | default "Развернуть все" }}">
        <span class="accordion-toggle-all__icon" aria-hidden="true"></span>
        <span class="accordion-toggle-all__label">{{ .Get "expand" | default "Развернуть все" }}</span>
    </button>
    <button type="button" class="accordion-toggle-all accordion-toggle-all--collapse" data-action="collapse" aria-label="{{ .Get "collapse" | default "Свернуть все" }}">
        <span class="accordion-toggle-all__icon" aria-hidden="true"></span>
        <span class="accordion-toggle-all__label">{{ .Get "collapse" | default "Свернуть все" }}</span>
    </button>
</div>
<script>
(function () {
    if (window.__accordionControlsInit) return;
    window.__accordionControlsInit = true;
    document.addEventListener("click", function (e) {
        var btn = e.target.closest(".accordion-toggle-all");
        if (!btn) return;
        var article = btn.closest(".article-content");
        if (!article) return;
        var open = btn.dataset.action === "expand";
        article.querySelectorAll("details.post-accordion").forEach(function (d) {
            d.open = open;
        });
    });
})();
</script>
